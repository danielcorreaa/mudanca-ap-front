<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MudaEasy - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        solarized: { bg: '#002b36', card: '#073642', text: '#93a1a1', accent: '#268bd2' },
                        cyber: { bg: '#050505', card: '#1a1a1a', text: '#00ff41', accent: '#ff00ff' },
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@700;800&display=swap');
        body { font-family: 'Inter', sans-serif; transition: all 0.3s; }
        .font-brand { font-family: 'Montserrat', sans-serif; }

        /* Estilos de Tema */
        .dark body { background-color: #0f172a; color: #f1f5f9; }
        .theme-solarized body { background-color: #002b36; color: #93a1a1; }
        .theme-cyber body { background-color: #050505; color: #00ff41; }

        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(128, 128, 128, 0.2);
        }
        .light .auth-card { background: white; border-color: #e2e8f0; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md auth-card p-8 rounded-3xl shadow-2xl">
        <div class="text-center mb-8">
            <h1 id="auth-title" class="text-3xl font-brand font-bold mb-2">Bem-vindo de volta</h1>
            <p id="auth-subtitle" class="opacity-70">Acesse sua lista de mudança</p>
        </div>

        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-2">Usuário</label>
                <input type="text" id="username" required class="w-full px-4 py-3 rounded-xl bg-black/5 dark:bg-white/5 border border-transparent focus:border-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-2">Senha</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl bg-black/5 dark:bg-white/5 border border-transparent focus:border-blue-500 outline-none transition">
            </div>
            <button type="submit" id="submit-btn" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition transform active:scale-95">
                Entrar
            </button>
        </form>

        <div id="auth-message" class="mt-4 p-3 rounded-lg text-sm hidden text-center"></div>

        <div class="mt-8 pt-6 border-t border-gray-500/20 text-center">
            <button onclick="toggleMode()" id="toggle-btn" class="text-blue-500 font-semibold hover:underline">
                Não tem conta? Cadastre-se
            </button>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8080/api/itens"; // Endpoint Unificado
        const AUTH_URL = "http://localhost:8080/api/auth"; // Assumindo padrão baseado no seu endpoint
        
        let isLoginMode = true;

        function applyTheme() {
            const theme = localStorage.getItem('app-theme') || 'light';
            document.documentElement.className = theme === 'light' ? 'light' : (theme === 'dark' ? 'dark' : `theme-${theme}`);
        }
        applyTheme();

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'Bem-vindo de volta' : 'Crie sua conta';
            document.getElementById('auth-subtitle').innerText = isLoginMode ? 'Acesse sua lista de mudança' : 'Comece a organizar hoje mesmo';
            document.getElementById('submit-btn').innerText = isLoginMode ? 'Entrar' : 'Cadastrar';
            document.getElementById('toggle-btn').innerText = isLoginMode ? 'Não tem conta? Cadastre-se' : 'Já tem conta? Faça Login';
        }

        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.innerText = "Processando...";

            try {
                // Adaptar conforme sua API real de auth se for diferente de /api/auth
                const endpoint = isLoginMode ? `${AUTH_URL}/login` : `${AUTH_URL}/register`;
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (isLoginMode) {
                        localStorage.setItem('auth_token', btoa(`${user}:${pass}`)); // Fallback se não usar JWT
                        window.location.href = 'app.html';
                    } else {
                        showMessage("Conta criada! Agora faça login.", "success");
                        toggleMode();
                    }
                } else {
                    showMessage("Erro na autenticação. Verifique os dados.", "error");
                }
            } catch (err) {
                showMessage("Erro de conexão com o servidor.", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = isLoginMode ? 'Entrar' : 'Cadastrar';
            }
        };

        function showMessage(text, type) {
            const msg = document.getElementById('auth-message');
            msg.innerText = text;
            msg.className = `mt-4 p-3 rounded-lg text-sm text-center ${type === 'error' ? 'bg-red-500/20 text-red-400' : 'bg-green-500/20 text-green-400'}`;
        }
    </script>
</body>
</html>
